[package]
name = "soundboard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
libpulse-binding = { version = "2.30.1", features = ["pa_v12", "pa_v13", "pa_v14", "pa_v15"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
